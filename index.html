<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="热量差" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>热量差</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: rgba(255, 255, 255, 0.92);
      --card-solid: #ffffff;
      --field: #f2f2f7;
      --text: #1d1d1f;
      --sub: #86868b;
      --accent: #007aff;
      --accent-soft: rgba(0, 122, 255, 0.1);
      --green: #34c759;
      --green-soft: rgba(52, 199, 89, 0.12);
      --orange: #ff9500;
      --red: #ff3b30;
      --red-soft: rgba(255, 59, 48, 0.1);
      --border: rgba(0, 0, 0, 0.06);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: rgba(28, 28, 30, 0.88);
        --card-solid: #1c1c1e;
        --field: #2c2c2e;
        --text: #f5f5f7;
        --sub: #98989d;
        --accent: #0a84ff;
        --accent-soft: rgba(10, 132, 255, 0.18);
        --green: #30d158;
        --green-soft: rgba(48, 209, 88, 0.16);
        --orange: #ff9f0a;
        --red: #ff453a;
        --red-soft: rgba(255, 69, 58, 0.18);
        --border: rgba(255, 255, 255, 0.08);
        --shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-variant-numeric: tabular-nums;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: calc(env(safe-area-inset-top, 16px) + 8px) 18px calc(env(safe-area-inset-bottom, 24px) + 32px);
      max-width: 460px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
    }

    /* 顶部导航栏：Apple Health 风格 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 2px 20px;
    }
    .brand-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .nav-pills {
      display: flex;
      gap: 8px;
    }
    .pill-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .pill-btn:active { transform: scale(0.95); }

    /* 通用 Bento 卡片 */
    .card {
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 22px 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    /* 1. 核心数据看板（Apple Fitness 仪表盘风格） */
    .hero-top {
      text-align: center;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      color: var(--sub);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .hero-number {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--green);
      line-height: 1.08;
      margin: 6px 0 4px;
    }
    .hero-number small {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin-left: 4px;
      letter-spacing: 0;
    }
    .hero-sub {
      font-size: 12px;
      color: var(--sub);
    }
    .hero-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding-top: 16px;
      gap: 12px;
    }
    .metric-item {
      text-align: center;
      padding: 4px 0;
    }
    .metric-item:first-child {
      border-right: 1px solid var(--border);
    }
    .metric-val {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 4px;
    }

    /* 2. 今日打卡卡片（严格按单行流式排版） */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .date-picker {
      width: auto;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--field);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      outline: none;
    }

    /* 状态面板：第一行已记摄入/体重，第二行当日差值 */
    .status-panel {
      background: var(--field);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }
    .status-line-1 {
      font-size: 14px;
      font-weight: 500;
      color: var(--sub);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-line-2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .progress-track {
      height: 6px;
      background: rgba(120, 120, 128, 0.16);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--green);
      border-radius: 999px;
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1), background 0.3s ease;
    }

    /* 输入框容器（独占一行 + 右侧单位标签） */
    .input-group {
      margin-bottom: 16px;
    }
    .input-group:last-child {
      margin-bottom: 0;
    }
    .input-box {
      position: relative;
      width: 100%;
      margin-bottom: 10px;
    }
    .input-box input, select, .raw-input {
      width: 100%;
      padding: 15px 56px 15px 16px;
      border-radius: 16px;
      border: 1px solid transparent;
      background: var(--field);
      color: var(--text);
      font-size: 16px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .input-box input:focus, select:focus, .raw-input:focus {
      border-color: var(--accent);
      background: var(--card-solid);
    }
    .input-box input::placeholder, .raw-input::placeholder {
      color: var(--sub);
      font-weight: 400;
    }
    .unit-tag {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      font-weight: 600;
      color: var(--sub);
      pointer-events: none;
    }

    /* 按钮排版：热量双按钮一行，体重单按钮一行 */
    .btn-dual-row {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 10px;
    }
    .btn-single-row {
      display: block;
      width: 100%;
    }
    .btn {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }
    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }
    .btn-tinted {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .btn-neutral {
      background: var(--field);
      color: var(--text);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 18px 0;
    }

    /* 折叠面板与表单 */
    .hidden { display: none !important; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }
    .form-item label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--sub);
      margin-bottom: 6px;
    }
    .form-item .raw-input, .form-item select {
      padding: 12px 14px;
      font-size: 15px;
    }
    .full-width { grid-column: span 2; }

    /* 诊断面板 */
    .diag-box {
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--field);
      font-size: 13.5px;
      line-height: 1.6;
    }
    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 10px 0;
      font-size: 14px;
      line-height: 1.4;
      cursor: pointer;
    }
    .check-item input {
      width: 18px;
      height: 18px;
      margin-top: 1px;
      accent-color: var(--accent);
    }

    /* 历史记录列表 */
    .log-list { list-style: none; margin-top: 6px; }
    .log-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .log-item:last-child { border-bottom: none; padding-bottom: 2px; }
    .log-date {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .log-meta {
      font-size: 13px;
      color: var(--sub);
    }
    .log-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }
    .badge-plus { background: var(--green-soft); color: var(--green); }
    .badge-minus { background: var(--red-soft); color: var(--red); }
    .icon-btn {
      background: var(--field);
      border: none;
      color: var(--text);
      padding: 6px 11px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .icon-btn:active { transform: scale(0.94); }

    /* iOS 原生感毛玻璃编辑弹窗 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-sheet {
      background: var(--card-solid);
      width: 100%;
      max-width: 360px;
      border-radius: 24px;
      padding: 22px 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <header>
    <div class="brand-title">热量差</div>
    <div class="nav-pills">
      <button class="pill-btn" onclick="toggleCard('plateauCard')">平台期诊断</button>
      <button class="pill-btn" onclick="toggleCard('settingsCard')">参数与提醒</button>
    </div>
  </header>

  <!-- 1. 核心数据看板 -->
  <section class="card">
    <div class="hero-top">
      <div class="eyebrow">累计热量缺口折合减重</div>
      <div class="hero-number" id="totalJin">0.00<small>斤</small></div>
      <div class="hero-sub" id="kcalPerJinNote">按 3850 kcal / 斤 换算</div>
    </div>
    <div class="hero-metrics">
      <div class="metric-item">
        <div class="eyebrow">每日身体燃烧 (TDEE)</div>
        <div class="metric-val" id="tdeeDisplay">0 kcal</div>
      </div>
      <div class="metric-item">
        <div class="eyebrow">累计总差值</div>
        <div class="metric-val" id="totalDeficitDisplay">0 kcal</div>
      </div>
    </div>
  </section>

  <!-- 2. 今日打卡卡片（严格分行布局） -->
  <section class="card">
    <div class="card-header">
      <span class="card-title">今日记录</span>
      <input type="date" id="logDate" class="date-picker" onchange="renderTodayStatus()" />
    </div>

    <!-- 状态面板：第一行已记摄入/体重，第二行当日差值 -->
    <div class="status-panel">
      <div class="status-line-1">
        <span id="todayIntakeText">已记摄入：0 kcal</span>
        <span id="todayWeightText">空腹体重：未记录</span>
      </div>
      <div class="status-line-2">
        <span id="todayDiffText">当日差值 -- kcal</span>
        <span id="todayRemainText" style="font-size:12px; font-weight:500; color:var(--sub);"></span>
      </div>
      <div class="progress-track">
        <div class="progress-bar" id="intakeProgress"></div>
      </div>
    </div>

    <!-- 热量录入区：第一行输入框，第二行「+ 累加」与「改总数」 -->
    <div class="input-group">
      <div class="input-box">
        <input type="number" id="dailyInput" placeholder="输入本餐 / 今日热量" inputmode="numeric" />
        <span class="unit-tag">kcal</span>
      </div>
      <div class="btn-dual-row">
        <button class="btn btn-primary" onclick="saveDailyLog('add')">＋ 累加</button>
        <button class="btn btn-tinted" onclick="saveDailyLog('set')">改总数</button>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 体重录入区：第一行输入框，第二行「存体重」 -->
    <div class="input-group">
      <div class="input-box">
        <input type="number" id="dailyWeight" placeholder="选填：今日空腹体重" inputmode="decimal" step="0.1" />
        <span class="unit-tag">斤</span>
      </div>
      <div class="btn-single-row">
        <button class="btn btn-neutral" onclick="saveWeightOnly()">存体重</button>
      </div>
    </div>
  </section>

  <!-- 3. 平台期诊断与代谢校准面板（默认折叠） -->
  <section class="card hidden" id="plateauCard">
    <div class="card-header" style="margin-bottom:6px;">
      <span class="card-title">平台期诊断与校准</span>
      <button class="icon-btn" onclick="toggleCard('plateauCard')">收起</button>
    </div>
    <p style="font-size:13px; color:var(--sub); line-height:1.5;">
      自动比对「账面累计减重」与「实际体重变化」，定位是饮食少算了，还是长期节食导致代谢适应。
    </p>

    <div class="diag-box" id="autoDiagResult">正在分析记录...</div>

    <div style="margin-top:14px; font-weight:600; font-size:13px; color:var(--sub);">勾选近期体感或习惯（辅助定位原因）：</div>
    <label class="check-item"><input type="checkbox" id="chk_oil" onchange="runPlateauAnalysis()" /> <span>每周外卖/堂食 ≥ 4次，或未称量炒菜底油与酱料</span></label>
    <label class="check-item"><input type="checkbox" id="chk_seat" onchange="runPlateauAnalysis()" /> <span>选了运动系数，但除运动那 1 小时外其余时间久坐</span></label>
    <label class="check-item"><input type="checkbox" id="chk_cold" onchange="runPlateauAnalysis()" /> <span>已连续控制饮食超 4 周，近期手脚偏凉、易犯困或乏力</span></label>

    <div class="diag-box" id="adviceBox" style="margin-top:10px;">
      勾选上方选项或录入至少 2 次不同日期的体重后，这里将生成校准建议。
    </div>

    <div style="margin-top:14px;">
      <div class="input-box">
        <input type="number" id="customTdeeInput" placeholder="输入校准后的每日燃烧值" inputmode="numeric" />
        <span class="unit-tag">kcal</span>
      </div>
      <div class="btn-dual-row">
        <button class="btn btn-primary" onclick="applyCustomTdee()">应用校准</button>
        <button class="btn btn-neutral" onclick="resetCustomTdee()">恢复默认公式</button>
      </div>
    </div>
  </section>

  <!-- 4. 身体参数与提醒设置（默认折叠） -->
  <section class="card hidden" id="settingsCard">
    <div class="card-header" style="margin-bottom:4px;">
      <span class="card-title">身体参数与提醒</span>
      <button class="icon-btn" onclick="toggleCard('settingsCard')">收起</button>
    </div>
    <div class="form-grid">
      <div class="form-item">
        <label>性别</label>
        <select id="gender" onchange="saveProfile()">
          <option value="male">男</option>
          <option value="female">女</option>
        </select>
      </div>
      <div class="form-item">
        <label>年龄</label>
        <input type="number" id="age" class="raw-input" value="23" inputmode="numeric" onchange="saveProfile()" />
      </div>
      <div class="form-item">
        <label>身高 (cm)</label>
        <input type="number" id="height" class="raw-input" value="177" inputmode="decimal" onchange="saveProfile()" />
      </div>
      <div class="form-item">
        <label>体重基准 (kg)</label>
        <input type="number" id="weight" class="raw-input" value="73.5" inputmode="decimal" onchange="saveProfile()" />
      </div>
      <div class="form-item full-width">
        <label>日常运动系数</label>
        <select id="activity" onchange="saveProfile()">
          <option value="1.2">1.2 - 久坐（几乎不运动）</option>
          <option value="1.375" selected>1.375 - 轻度（每周运动 1-3 次）</option>
          <option value="1.55">1.55 - 中度（每周运动 3-5 次）</option>
          <option value="1.725">1.725 - 高强度（每周 6-7 次）</option>
        </select>
      </div>
      <div class="form-item">
        <label>每斤热力值 (kcal)</label>
        <input type="number" id="kcalPerJin" class="raw-input" value="3850" inputmode="numeric" onchange="saveProfile()" />
      </div>
      <div class="form-item">
        <label>每日提醒时间</label>
        <input type="time" id="remindTime" class="raw-input" value="21:30" onchange="saveProfile()" />
      </div>
      <div class="form-item full-width" style="margin-top:6px;">
        <button class="btn btn-tinted" onclick="downloadCalendarReminder()">
          🔔 添加到手机系统日历每日提醒
        </button>
      </div>
    </div>
  </section>

  <!-- 5. 历史记录 -->
  <section class="card">
    <div class="card-header" style="margin-bottom:6px;">
      <span class="card-title">历史记录</span>
      <button class="icon-btn" style="color:var(--sub);" onclick="clearAllLogs()">清空</button>
    </div>
    <ul class="log-list" id="logList"></ul>
  </section>

  <!-- 6. iOS 风格修改历史记录弹窗 -->
  <div class="modal-backdrop hidden" id="editModal">
    <div class="modal-sheet">
      <div class="modal-title" id="editModalTitle">修改记录</div>
      <div class="input-group">
        <label style="display:block; font-size:12px; color:var(--sub); margin-bottom:6px;">当日总摄入热量</label>
        <div class="input-box">
          <input type="number" id="editIntakeInput" inputmode="numeric" />
          <span class="unit-tag">kcal</span>
        </div>
      </div>
      <div class="input-group" style="margin-bottom:18px;">
        <label style="display:block; font-size:12px; color:var(--sub); margin-bottom:6px;">当日空腹体重（选填）</label>
        <div class="input-box" style="margin-bottom:0;">
          <input type="number" id="editWeightInput" inputmode="decimal" step="0.1" placeholder="未记录" />
          <span class="unit-tag">斤</span>
        </div>
      </div>
      <div class="btn-dual-row" style="grid-template-columns: 1fr 1fr;">
        <button class="btn btn-neutral" onclick="closeEditModal()">取消</button>
        <button class="btn btn-primary" onclick="confirmEditLog()">保存修改</button>
      </div>
      <button class="btn" style="margin-top:10px; color:var(--red); background:var(--red-soft); font-size:14px; padding:11px;" onclick="deleteCurrentEditingLog()">删除该日记录</button>
    </div>
  </div>

  <script>
    const PROFILE_KEY = 'cal_profile_v2';
    const LOGS_KEY = 'cal_logs_v1';

    let profile = JSON.parse(localStorage.getItem(PROFILE_KEY)) ||
                  JSON.parse(localStorage.getItem('cal_profile_v1')) || {
      gender: 'male', age: 23, height: 177, weight: 73.5, activity: 1.375,
      kcalPerJin: 3850, remindTime: '21:30', customTdee: null
    };
    let logs = JSON.parse(localStorage.getItem(LOGS_KEY)) || [];
    let editingDate = null;

    function init() {
      document.getElementById('logDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('gender').value = profile.gender;
      document.getElementById('age').value = profile.age;
      document.getElementById('height').value = profile.height;
      document.getElementById('weight').value = profile.weight;
      document.getElementById('activity').value = profile.activity;
      document.getElementById('kcalPerJin').value = profile.kcalPerJin || 3850;
      document.getElementById('remindTime').value = profile.remindTime || '21:30';
      if (profile.customTdee) {
        document.getElementById('customTdeeInput').value = profile.customTdee;
      }
      render();
      checkWebNotification();
    }

    function calcFormulaTDEE() {
      const s = profile.gender === 'male' ? 5 : -161;
      const bmr = 10 * profile.weight + 6.25 * profile.height - 5 * profile.age + s;
      return Math.round(bmr * profile.activity);
    }

    function calcTDEE() {
      return profile.customTdee ? Number(profile.customTdee) : calcFormulaTDEE();
    }

    function saveProfile() {
      profile.gender = document.getElementById('gender').value;
      profile.age = Number(document.getElementById('age').value) || 23;
      profile.height = Number(document.getElementById('height').value) || 177;
      profile.weight = Number(document.getElementById('weight').value) || 70;
      profile.activity = Number(document.getElementById('activity').value) || 1.375;
      profile.kcalPerJin = Number(document.getElementById('kcalPerJin').value) || 3850;
      profile.remindTime = document.getElementById('remindTime').value;
      localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
      render();
    }

    // 录入热量：mode = 'add'（累加）或 'set'（改总数）
    function saveDailyLog(mode) {
      const inputEl = document.getElementById('dailyInput');
      if (inputEl.value === '') return;

      const val = Number(inputEl.value);
      const date = document.getElementById('logDate').value;
      const tdee = calcTDEE();
      const idx = logs.findIndex(item => item.date === date);

      if (idx > -1) {
        const newIntake = (mode === 'add') ? (Number(logs[idx].intake) + val) : val;
        logs[idx].intake = newIntake;
        logs[idx].tdee = tdee;
        logs[idx].diff = tdee - newIntake;
      } else {
        logs.unshift({ date, intake: val, tdee, diff: tdee - val, weightJin: null });
        logs.sort((a, b) => b.date.localeCompare(a.date));
      }

      localStorage.setItem(LOGS_KEY, JSON.stringify(logs));
      inputEl.value = '';
      render();
    }

    // 单独存体重
    function saveWeightOnly() {
      const weightEl = document.getElementById('dailyWeight');
      if (weightEl.value === '') return;
      const weightJin = Number(weightEl.value);
      const date = document.getElementById('logDate').value;
      const tdee = calcTDEE();
      const idx = logs.findIndex(item => item.date === date);

      if (idx > -1) {
        logs[idx].weightJin = weightJin;
      } else {
        logs.unshift({ date, intake: 0, tdee, diff: tdee, weightJin });
        logs.sort((a, b) => b.date.localeCompare(a.date));
      }
      localStorage.setItem(LOGS_KEY, JSON.stringify(logs));
      weightEl.value = '';
      render();
    }

    // 打开 iOS 风格修改弹窗
    function openEditModal(date) {
      const item = logs.find(l => l.date === date);
      if (!item) return;
      editingDate = date;
      document.getElementById('editModalTitle').textContent = `修改 ${date}`;
      document.getElementById('editIntakeInput').value = item.intake;
      document.getElementById('editWeightInput').value = item.weightJin || '';
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      editingDate = null;
      document.getElementById('editModal').classList.add('hidden');
    }

    function confirmEditLog() {
      if (!editingDate) return;
      const item = logs.find(l => l.date === editingDate);
      if (!item) return;

      const newIntake = Number(document.getElementById('editIntakeInput').value) || 0;
      const weightStr = document.getElementById('editWeightInput').value.trim();

      item.intake = newIntake;
      item.diff = item.tdee - newIntake;
      item.weightJin = weightStr !== '' ? Number(weightStr) : null;

      localStorage.setItem(LOGS_KEY, JSON.stringify(logs));
      closeEditModal();
      render();
    }

    function deleteCurrentEditingLog() {
      if (!editingDate) return;
      logs = logs.filter(item => item.date !== editingDate);
      localStorage.setItem(LOGS_KEY, JSON.stringify(logs));
      closeEditModal();
      render();
    }

    function clearAllLogs() {
      if (confirm('确定清空所有历史记录吗？')) {
        logs = [];
        localStorage.setItem(LOGS_KEY, JSON.stringify(logs));
        render();
      }
    }

    function toggleCard(id) {
      document.getElementById(id).classList.toggle('hidden');
      if (id === 'plateauCard') runPlateauAnalysis();
    }

    // 渲染今日状态面板与动态能量条
    function renderTodayStatus() {
      const date = document.getElementById('logDate').value;
      const item = logs.find(l => l.date === date);
      const tdee = calcTDEE();

      const intakeText = document.getElementById('todayIntakeText');
      const weightText = document.getElementById('todayWeightText');
      const diffText = document.getElementById('todayDiffText');
      const remainText = document.getElementById('todayRemainText');
      const bar = document.getElementById('intakeProgress');

      if (item) {
        intakeText.textContent = `已记摄入：${item.intake} kcal`;
        weightText.textContent = item.weightJin ? `空腹体重：${item.weightJin} 斤` : '空腹体重：未记录';

        const sign = item.diff >= 0 ? '+' : '';
        diffText.textContent = `当日差值 ${sign}${item.diff} kcal`;
        diffText.style.color = item.diff >= 0 ? 'var(--green)' : 'var(--red)';

        const pct = Math.min(100, Math.round((item.intake / tdee) * 100));
        bar.style.width = pct + '%';
        bar.style.background = item.intake > tdee ? 'var(--red)' : (pct > 85 ? 'var(--orange)' : 'var(--green)');
        remainText.textContent = `已消耗额度 ${pct}%`;
      } else {
        intakeText.textContent = '已记摄入：0 kcal';
        weightText.textContent = '空腹体重：未记录';
        diffText.textContent = `当日差值 -- kcal`;
        diffText.style.color = 'var(--text)';
        bar.style.width = '0%';
        remainText.textContent = `每日燃烧基准 ${tdee} kcal`;
      }
    }

    // 平台期诊断引擎
    function runPlateauAnalysis() {
      const diagEl = document.getElementById('autoDiagResult');
      const adviceEl = document.getElementById('adviceBox');
      const weightLogs = logs.filter(l => l.weightJin && l.weightJin > 0).sort((a, b) => a.date.localeCompare(b.date));

      let dailyError = 0;
      if (weightLogs.length < 2) {
        diagEl.innerHTML = `📊 <strong>数据积累中：</strong>目前仅有 ${weightLogs.length} 条空腹体重记录。建议每隔几天记录一次体重（至少 2 次），系统将自动测算「账面减重 vs 实际掉秤」的代谢偏差。`;
      } else {
        const first = weightLogs[0];
        const last = weightLogs[weightLogs.length - 1];
        const days = Math.max(1, (new Date(last.date) - new Date(first.date)) / (1000 * 3600 * 24));
        const actualLostJin = (first.weightJin - last.weightJin).toFixed(2);

        const periodLogs = logs.filter(l => l.date >= first.date && l.date <= last.date);
        const periodDeficit = periodLogs.reduce((s, i) => s + i.diff, 0);
        const expectedLostJin = (periodDeficit / profile.kcalPerJin).toFixed(2);
        dailyError = Math.round(((expectedLostJin - actualLostJin) * profile.kcalPerJin) / days);

        diagEl.innerHTML = `
          <div>📅 统计周期：${first.date} 至 ${last.date}（${days} 天）</div>
          <div style="margin-top:4px;">📉 账面应减：<strong>${expectedLostJin} 斤</strong> ｜ 实际减重：<strong>${actualLostJin} 斤</strong></div>
          <div style="margin-top:4px;">⚡ 日均隐形偏差：<strong>${dailyError > 0 ? '+' + dailyError : dailyError} kcal / 天</strong></div>
        `;
      }

      const isOil = document.getElementById('chk_oil').checked;
      const isSeat = document.getElementById('chk_seat').checked;
      const isCold = document.getElementById('chk_cold').checked;

      let reasons = [];
      if (isOil) reasons.push('<strong>1. 饮食隐形热量低估：</strong>外卖或炒菜底油极易带来每天 200~350 kcal 的隐形热量，建议记录外卖时直接多加 200 kcal。');
      if (isSeat) reasons.push('<strong>2. 运动消耗代偿效应：</strong>虽然每周运动 1~3 次，但身体在其余时间久坐会下调非运动消耗（NEAT），建议将运动系数调至 1.2，或将燃烧基准下调 150 kcal。');
      if (isCold) reasons.push('<strong>3. 长期热量缺口导致代谢适应：</strong>身体已进入节能模式。建议安排 2 天吃回 TDEE（多吃米饭/燕麦等碳水，控制油脂）恢复瘦素水平，并将每日燃烧基准下调 8%。');

      if (reasons.length === 0 && dailyError > 250) {
        reasons.push(`检测到日均约 ${dailyError} kcal 的未解释偏差，建议在下方将每日燃烧值校准为 <strong>${calcFormulaTDEE() - dailyError} kcal</strong>。`);
      } else if (reasons.length === 0) {
        reasons.push('当前账面热量差与身体实际代谢基本吻合，继续保持当前节奏即可。');
      }
      adviceEl.innerHTML = reasons.join('<br><br>');
    }

    function applyCustomTdee() {
      const val = Number(document.getElementById('customTdeeInput').value);
      if (!val || val < 800) return;
      profile.customTdee = val;
      localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
      render();
    }

    function resetCustomTdee() {
      profile.customTdee = null;
      document.getElementById('customTdeeInput').value = '';
      localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
      render();
    }

    // 生成手机日历提醒 (.ics)
    function downloadCalendarReminder() {
      const timeStr = (profile.remindTime || '21:30').replace(':', '') + '00';
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const appUrl = window.location.href;

      const icsContent = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//CalorieTracker//CN',
        'BEGIN:VEVENT',
        `DTSTART:${yyyy}${mm}${dd}T${timeStr}`,
        `DTEND:${yyyy}${mm}${dd}T${timeStr}`,
        'RRULE:FREQ=DAILY',
        'SUMMARY:🔥 记录今日卡路里与体重',
        `DESCRIPTION:点击打开热量差记录：${appUrl}`,
        `URL:${appUrl}`,
        'BEGIN:VALARM',
        'TRIGGER:-PT0M',
        'ACTION:DISPLAY',
        'DESCRIPTION:记录今日卡路里',
        'END:VALARM',
        'END:VEVENT',
        'END:VCALENDAR'
      ].join('\r\n');

      const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'calorie-reminder.ics';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function checkWebNotification() {
      setInterval(() => {
        const now = new Date();
        const hm = now.toTimeString().slice(0, 5);
        const today = now.toISOString().split('T')[0];
        const hasToday = logs.some(l => l.date === today);
        if (hm === profile.remindTime && !hasToday && 'Notification' in window && Notification.permission === 'granted') {
          new Notification('今日热量还未记录', { body: '花 5 秒输入今天的热量，看看累计减了多少斤！' });
        }
      }, 60000);
    }

    function render() {
      const tdee = calcTDEE();
      const totalDeficit = logs.reduce((sum, item) => sum + item.diff, 0);
      const jin = (totalDeficit / profile.kcalPerJin).toFixed(2);

      document.getElementById('tdeeDisplay').textContent = tdee + (profile.customTdee ? ' kcal (校准)' : ' kcal');
      document.getElementById('totalDeficitDisplay').textContent = (totalDeficit >= 0 ? '+' : '') + totalDeficit + ' kcal';
      document.getElementById('totalJin').innerHTML = `${jin}<small>斤</small>`;
      document.getElementById('kcalPerJinNote').textContent = `按 ${profile.kcalPerJin} kcal / 斤 换算`;

      renderTodayStatus();

      const listEl = document.getElementById('logList');
      if (logs.length === 0) {
        listEl.innerHTML = '<li class="log-item" style="color:var(--sub); font-size:14px;">暂无记录，在上方输入今日热量即可累加</li>';
        return;
      }
      listEl.innerHTML = logs.map(item => {
        const isPlus = item.diff >= 0;
        const sign = isPlus ? '+' : '';
        const itemJin = (item.diff / profile.kcalPerJin).toFixed(2);
        const weightStr = item.weightJin ? ` · 体重 ${item.weightJin}斤` : '';
        return `<li class="log-item">
          <div>
            <div class="log-date">${item.date}</div>
            <div class="log-meta">摄入 ${item.intake} kcal${weightStr}</div>
          </div>
          <div class="log-right">
            <span class="badge ${isPlus ? 'badge-plus' : 'badge-minus'}">${sign}${item.diff} (${sign}${itemJin}斤)</span>
            <button class="icon-btn" onclick="openEditModal('${item.date}')">修改</button>
          </div>
        </li>`;
      }).join('');
    }

    init();
  </script>
</body>
</html>
